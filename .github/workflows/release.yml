name: Nexuzy PMS Versioned Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax check
        run: npm run lint

      - name: Full test suite (unit/integration/smoke)
        run: npm test

      - name: Verify version and tag
        run: npm run verify

  build-windows:
    name: Build Windows installer
    needs: verify
    runs-on: windows-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Build Setup EXE
        run: npm run build:installer

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: nexuzy-windows-installer
          path: |
            dist/installer/Nexuzy-PMS-Setup-*.exe
            dist/installer/Nexuzy-PMS-Setup-*.exe.sha256
          if-no-files-found: error

  build-unix:
    name: Build Linux and macOS installers
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Build Linux and macOS packages
        run: node installer/build-cross-platform.js

      - name: Upload Linux and macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: nexuzy-linux-macos-installers
          path: |
            dist/installer/Nexuzy-PMS-*-linux-x64.run
            dist/installer/Nexuzy-PMS-*-linux-x64.run.sha256
            dist/installer/Nexuzy-PMS-*-linux-x64.tar.gz
            dist/installer/Nexuzy-PMS-*-linux-x64.tar.gz.sha256
            dist/installer/Nexuzy-PMS-*-macos-arm64.tar.gz
            dist/installer/Nexuzy-PMS-*-macos-arm64.tar.gz.sha256
            dist/installer/Nexuzy-PMS-*-macos-x64.tar.gz
            dist/installer/Nexuzy-PMS-*-macos-x64.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Package and publish GitHub release
    needs: [verify, build-windows, build-unix]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: nexuzy-*
          path: dist/installer
          merge-multiple: true

      - name: Ensure ZIP tooling
        run: command -v zip || (sudo apt-get update && sudo apt-get install -y zip)

      - name: Build source release package
        run: npm run release:package

      - name: Build all-platform installer bundle
        run: npm run package:installers

      - name: Re-verify release
        run: npm run verify

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/installer/Nexuzy-PMS-Setup-*.exe
            dist/installer/Nexuzy-PMS-Setup-*.exe.sha256
            dist/installer/Nexuzy-PMS-*-linux-x64.run
            dist/installer/Nexuzy-PMS-*-linux-x64.run.sha256
            dist/installer/Nexuzy-PMS-*-linux-x64.tar.gz
            dist/installer/Nexuzy-PMS-*-linux-x64.tar.gz.sha256
            dist/installer/Nexuzy-PMS-*-macos-arm64.tar.gz
            dist/installer/Nexuzy-PMS-*-macos-arm64.tar.gz.sha256
            dist/installer/Nexuzy-PMS-*-macos-x64.tar.gz
            dist/installer/Nexuzy-PMS-*-macos-x64.tar.gz.sha256
            dist/installer/Nexuzy-PMS-*-all-platforms.zip
            dist/installer/Nexuzy-PMS-*-all-platforms.zip.sha256
          body: |
            Nexuzy PMS versioned release.

            **Downloads**
            - `Nexuzy-PMS-<version>-all-platforms.zip` — Windows, Linux and macOS
              installers in one archive, with checksums and install instructions.
            - Windows: `Nexuzy-PMS-Setup-<version>.exe`
            - Linux x64: `.run` or `.tar.gz`
            - macOS: `-macos-arm64.tar.gz` (Apple Silicon) or `-macos-x64.tar.gz`

            The individual installer files are attached for the in-app updater,
            which matches the asset for the current platform. All assets include
            SHA-256 files.

            The source package contains application code only: no hotel database,
            `.env` credentials, uploads or backups. Existing installations preserve
            `data/`, `backups/` and configuration during upgrade.

            See CHANGELOG.md for release notes and docs/LAN_SETUP.md for local
            network setup.
